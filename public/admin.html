<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#050505] text-white min-h-screen flex items-center justify-center p-4">
    <div id="login-zone" class="w-full max-w-md bg-zinc-900 p-8 rounded-[30px] border border-white/10 shadow-2xl">
        <h1 class="text-xl font-bold mb-6 italic text-blue-500">SECURE ACCESS</h1>
        <input type="text" id="u" placeholder="ID" class="w-full bg-black p-4 rounded-2xl mb-4 border border-white/5 outline-none">
        <input type="password" id="p" placeholder="KEY" class="w-full bg-black p-4 rounded-2xl mb-6 border border-white/5 outline-none">
        <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-2xl font-bold uppercase">Login</button>
    </div>

    <div id="upload-zone" class="hidden w-full max-w-xl bg-zinc-900 p-8 rounded-[30px] border border-white/10 shadow-2xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-xl font-bold italic">ADMIN PANEL</h1>
            <a href="/" class="text-[10px] text-zinc-500 border border-zinc-800 px-3 py-1 rounded-full uppercase">Home</a>
        </div>
        <div class="space-y-6">
            <select id="target" class="w-full bg-black p-4 rounded-2xl border border-white/5">
                <option value="lou">劉寶俊</option>
                <option value="peter">陳彼得</option>
                <option value="yuan">袁底褲</option>
            </select>
            <input type="file" id="file" class="w-full bg-black p-4 rounded-2xl border border-white/5 text-sm file:bg-blue-600 file:border-0 file:rounded-md file:text-white file:px-3">
            <button onclick="upload()" id="upBtn" class="w-full bg-white text-black py-4 rounded-2xl font-black uppercase tracking-widest">Execute Upload</button>
            <p id="status" class="text-center text-[10px] font-mono text-zinc-500 uppercase"></p>
        </div>
    </div>

    <script>
        async function login() {
            const user = document.getElementById('u').value;
            const pass = document.getElementById('p').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user, pass })
            });
            if(res.ok) {
                document.getElementById('login-zone').style.display = 'none';
                document.getElementById('upload-zone').classList.remove('hidden');
            } else { alert("Denied"); }
        }

        async function upload() {
            const file = document.getElementById('file').files[0];
            if(!file) return alert("No file");
            const btn = document.getElementById('upBtn');
            const status = document.getElementById('status');
            const fd = new FormData();
            fd.append('person', document.getElementById('target').value);
            fd.append('file', file);
            btn.disabled = true;
            status.innerText = "Transmitting...";
            const res = await fetch('/api/upload', { method: 'POST', body: fd });
            status.innerText = await res.text();
            btn.disabled = false;
        }
    </script>
</body>
</html>
