<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 背景圖設定 */
        body { 
            background: url('bg.jpg') no-repeat center center fixed; 
            background-size: cover; /* 讓圖片填滿螢幕 */
            overflow-x: hidden; 
            perspective: 1000px; 
        }
        /* 增加一個深色遮罩，確保文字看得清楚 */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4); /* 40% 的黑色遮罩 */
            z-index: -1;
        }
        /* 半透明毛玻璃卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px); /* 模糊效果 */
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .card { transition: transform 0.2s ease-out; transform-style: preserve-3d; }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-6">
    <div class="bg-overlay"></div>
    
    <nav class="absolute top-0 w-full p-6 flex justify-between items-center z-50">
        <div class="text-[10px] tracking-[0.5em] text-zinc-300 font-bold uppercase">System.Live</div>
        <a href="admin.html" class="text-[10px] tracking-widest text-zinc-300 hover:text-white transition uppercase border border-white/20 px-4 py-1 rounded-full bg-black/20">Admin Access</a>
    </nav>

    <h1 class="text-6xl md:text-8xl font-black mb-12 italic tracking-tighter text-white drop-shadow-2xl">VAULT</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-5xl z-10">
        <a href="person.html?id=lou&name=劉寶俊" class="card glass-card group p-10 rounded-[40px] text-center">
            <h2 class="text-2xl font-bold group-hover:scale-110 transition drop-shadow-md">劉寶俊</h2>
        </a>
        
        <a href="person.html?id=peter&name=陳彼得" class="card glass-card group p-10 rounded-[40px] text-center">
            <h2 class="text-2xl font-bold group-hover:scale-110 transition drop-shadow-md">陳彼得</h2>
        </a>
        
        <a href="person.html?id=yuan&name=袁底褲" class="card glass-card group p-10 rounded-[40px] text-center">
            <h2 class="text-2xl font-bold group-hover:scale-110 transition drop-shadow-md">袁底褲</h2>
        </a>

        <a href="person.html?id=hu&name=胡衣架" class="card glass-card group p-10 rounded-[40px] text-center">
            <h2 class="text-2xl font-bold group-hover:scale-110 transition drop-shadow-md">胡衣架</h2>
        </a>

        <a href="map.html" class="card glass-card group p-10 rounded-[40px] text-center border-orange-500/30">
            <h2 class="text-2xl font-bold group-hover:scale-110 transition text-orange-400 drop-shadow-md">大家樂定位</h2>
        </a>

        <div class="glass-card p-10 rounded-[40px] text-center opacity-30">
            <h2 class="text-xl italic">Future</h2>
        </div>
    </div>

    <script>
        const cards = document.querySelectorAll('.card');
        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth > 768) {
                const x = (window.innerWidth / 2 - e.clientX) / 40;
                const y = (window.innerHeight / 2 - e.clientY) / 40;
                cards.forEach(c => c.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`);
            }
        });
    </script>
</body>
</html>
