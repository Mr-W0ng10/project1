<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 1. 強制背景圖片鋪滿 */
        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 關鍵：確保圖片在手機上不變形並填滿 */
            z-index: -10; /* 放在最底層 */
        }

        /* 2. 遮罩層（讓圖片暗一點，字才清楚） */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* 40% 黑色遮罩 */
            z-index: -5;
        }

        body { 
            margin: 0;
            background-color: black; /* 如果圖片還沒載入，先顯示黑色 */
            color: white;
            min-height: 100vh;
        }

        /* 毛玻璃效果卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); /* 支援 iPhone */
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card { transition: transform 0.2s ease-out; }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-6">

    <!-- 直接使用 img 標籤當背景，這是最穩定的做法 -->
    <img src="/bg.jpg" id="bg-image" alt="background">
    
    <!-- 遮罩 -->
    <div class="bg-overlay"></div>

    <nav class="absolute top-0 w-full p-6 flex justify-between items-center z-50">
        <div class="text-[10px] tracking-[0.5em] text-zinc-400 font-bold uppercase">System.Live</div>
        <a href="admin.html" class="text-[10px] tracking-widest text-zinc-300 hover:text-white transition uppercase border border-white/20 px-4 py-1 rounded-full bg-black/40">Admin Access</a>
    </nav>

    <h1 class="text-6xl md:text-8xl font-black mb-12 italic tracking-tighter text-white drop-shadow-2xl z-10">VAULT</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-5xl z-10">
        <a href="person.html?id=lou&name=劉寶俊" class="card glass-card group p-10 rounded-[40px] text-center">
            <h2 class="text-2xl font-bold group-hover:scale-110 transition">劉寶俊</h2>
        </a>
        
        <a href="person.html?id=peter&name=陳彼得" class="card glass-card group p-10 rounded-[40px] text-center">
            <h2 class="text-2xl font-bold group-hover:scale-110 transition">陳彼得</h2>
        </a>
        
        <a href="person.html?id=yuan&name=袁底褲" class="card glass-card group p-10 rounded-[40px] text-center">
            <h2 class="text-2xl font-bold group-hover:scale-110 transition">袁底褲</h2>
        </a>

        <a href="person.html?id=hu&name=胡衣架" class="card glass-card group p-10 rounded-[40px] text-center">
            <h2 class="text-2xl font-bold group-hover:scale-110 transition">胡衣架</h2>
        </a>

        <a href="map.html" class="card glass-card group p-10 rounded-[40px] text-center">
            <h2 class="text-2xl font-bold group-hover:scale-110 transition text-orange-400">大家樂定位</h2>
        </a>

        <div class="glass-card p-10 rounded-[40px] text-center opacity-30">
            <h2 class="text-xl italic">Future</h2>
        </div>
    </div>

    <script>
        const cards = document.querySelectorAll('.card');
        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth > 768) {
                const x = (window.innerWidth / 2 - e.clientX) / 40;
                const y = (window.innerHeight / 2 - e.clientY) / 40;
                cards.forEach(c => c.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`);
            }
        });
    </script>
</body>
</html>
