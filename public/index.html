<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; overflow-x: hidden; perspective: 1000px; }
        .card { transition: transform 0.2s ease-out; transform-style: preserve-3d; }
        .glow { position: fixed; width: 400px; height: 400px; background: radial-gradient(circle, rgba(29,78,216,0.1) 0%, transparent 70%); border-radius: 50%; pointer-events: none; z-index: 0; transform: translate(-50%, -50%); }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-6">
    <div class="glow" id="glow"></div>
    <nav class="absolute top-0 w-full p-6 flex justify-between items-center z-50">
        <div class="text-[10px] tracking-[0.5em] text-zinc-600 font-bold uppercase">System.Live</div>
        <a href="admin.html" class="text-[10px] tracking-widest text-zinc-500 hover:text-white transition uppercase">Admin Access</a>
    </nav>
    <h1 class="text-5xl md:text-7xl font-black mb-12 italic tracking-tighter bg-gradient-to-b from-white to-zinc-700 bg-clip-text text-transparent">VAULT</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl z-10">
        <a href="person.html?id=lou&name=劉寶俊" class="card group bg-white/5 border border-white/10 p-10 rounded-[30px] text-center hover:border-blue-500">
            <h2 class="text-2xl font-bold group-hover:scale-110 transition">劉寶俊</h2>
        </a>
        <a href="person.html?id=peter&name=陳彼得" class="card group bg-white/5 border border-white/10 p-10 rounded-[30px] text-center hover:border-purple-500">
            <h2 class="text-2xl font-bold group-hover:scale-110 transition">陳彼得</h2>
        </a>
        <a href="person.html?id=yuan&name=袁底褲" class="card group bg-white/5 border border-white/10 p-10 rounded-[30px] text-center hover:border-pink-500">
            <h2 class="text-2xl font-bold group-hover:scale-110 transition">袁底褲</h2>
        </a>
        <div class="bg-black/50 border border-dashed border-white/5 p-10 rounded-[30px] text-center opacity-20">
            <h2 class="text-xl italic">Future</h2>
        </div>
    </div>
    <script>
        const glow = document.getElementById('glow');
        const cards = document.querySelectorAll('.card');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
            if(window.innerWidth > 768) {
                const x = (window.innerWidth / 2 - e.clientX) / 30;
                const y = (window.innerHeight / 2 - e.clientY) / 30;
                cards.forEach(c => c.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`);
            }
        });
    </script>
</body>
</html>
