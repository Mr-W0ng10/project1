<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gallery Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#050505] text-white min-h-screen p-8 md:p-16">
    <div class="max-w-7xl mx-auto">
        <a href="index.html" class="text-zinc-600 hover:text-white transition uppercase text-xs tracking-widest font-bold">← Back to Directory</a>
        <h1 id="pname" class="text-6xl font-black mt-8 mb-16 tracking-tighter uppercase">Vault</h1>
        
        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">
            <p id="loading" class="col-span-full text-zinc-700 italic text-2xl animate-pulse">Initializing data stream...</p>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const tag = params.get('id');
        document.getElementById('pname').innerText = params.get('name') || "Archive";

        async function load() {
            if(!tag) return;
            const res = await fetch(`/api/media/${tag}`);
            const files = await res.json();
            const container = document.getElementById('gallery');
            document.getElementById('loading').style.display = 'none';

            if(files.length === 0) {
                container.innerHTML = '<p class="text-zinc-800 text-xl font-bold">NO DATA FOUND IN THIS VAULT.</p>';
                return;
            }

            files.forEach(f => {
                const div = document.createElement('div');
                div.className = "bg-zinc-900 rounded-[30px] overflow-hidden border border-white/5 shadow-2xl";
                if(f.resource_type === "video") {
                    div.innerHTML = `<video src="${f.secure_url}" controls class="w-full h-72 object-cover"></video>`;
                } else {
                    div.innerHTML = `<img src="${f.secure_url}" class="w-full h-72 object-cover hover:scale-110 transition duration-700">`;
                }
                container.appendChild(div);
            });
        }
        load();
    </script>
</body>
</html>
