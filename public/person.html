<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#050505] text-white min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <a href="/" class="text-zinc-600 hover:text-white uppercase text-[10px] tracking-widest font-bold">← Home</a>
        <h1 id="pname" class="text-4xl md:text-6xl font-black mt-8 mb-12 tracking-tighter uppercase">Vault</h1>
        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <p id="loading" class="col-span-full text-zinc-800 italic animate-pulse">Scanning Cloud...</p>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const tag = params.get('id');
        document.getElementById('pname').innerText = params.get('name') || "Vault";
        async function load() {
            if(!tag) return;
            const res = await fetch(`/api/media/${tag}`);
            const files = await res.json();
            const container = document.getElementById('gallery');
            document.getElementById('loading').style.display = 'none';
            if(files.length === 0) {
                container.innerHTML = '<p class="text-zinc-800 font-bold uppercase">Empty Archive.</p>';
                return;
            }
            files.forEach(f => {
                const div = document.createElement('div');
                div.className = "bg-zinc-900 rounded-3xl overflow-hidden border border-white/5";
                if(f.resource_type === "video") {
                    div.innerHTML = `<video src="${f.secure_url}" controls class="w-full h-64 object-cover"></video>`;
                } else {
                    div.innerHTML = `<img src="${f.secure_url}" class="w-full h-64 object-cover">`;
                }
                container.appendChild(div);
            });
        }
        load();
    </script>
</body>
</html>
